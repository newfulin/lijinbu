name: Windows portable zip

# 在 GitHub Windows runner 打免安装绿包（lijinbu.exe → zip）
# 触发：Actions → Run workflow；或 push 到 main 且改动 app/ 或本工作流

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - ".github/workflows/windows-portable.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install npm deps
        run: npm ci

      - name: Build frontend + Tauri (NSIS + release exe)
        run: npx tauri build --bundles nsis

      - name: Pack portable zip
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = Get-Content "app/package.json" -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $exe = Join-Path $PWD "app\src-tauri\target\release\lijinbu.exe"
          if (-not (Test-Path $exe)) {
            throw "lijinbu.exe missing: $exe"
          }
          $outDir = Join-Path $PWD "release\windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zipName = "礼金簿_${ver}_win_portable.zip"
          $zipPath = Join-Path $outDir $zipName
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path $exe -DestinationPath $zipPath -Force
          Get-Item $zipPath | Format-List FullName, Length
          # expose for next steps
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: List NSIS outputs
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $nsis = "app\src-tauri\target\release\bundle\nsis"
          if (Test-Path $nsis) {
            Get-ChildItem -Recurse $nsis -Filter *.exe |
              ForEach-Object { "{0}`t{1:N0} bytes" -f $_.FullName, $_.Length }
          } else {
            Write-Host "NSIS dir missing (non-fatal for portable)"
          }

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: lijinbu-windows-portable
          path: release/windows/礼金簿_*_win_portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload NSIS setup (optional)
        uses: actions/upload-artifact@v4
        with:
          name: lijinbu-windows-nsis
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30
